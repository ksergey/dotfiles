#-----------------------------------------------------------------------------------------------------------
# Env
#-----------------------------------------------------------------------------------------------------------

env=XCURSOR_SIZE,20
env=XCURSOR_THEME,Bibata-Modern-Classic

#-----------------------------------------------------------------------------------------------------------
# Autostart
#-----------------------------------------------------------------------------------------------------------

exec-once=awww-daemon
exec-once=/usr/lib/xdg-desktop-portal-wlr &
exec-once=dunst &
exec-once=waybar &
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0 &
exec-once=wl-paste --type text --watch cliphist store &
exec-once=wl-paste --type image --watch cliphist store &
exec-once=hypridle -q &
exec-once=sunsetr &
exec-once=firefox &

#-----------------------------------------------------------------------------------------------------------
# Binds
#-----------------------------------------------------------------------------------------------------------

# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=CTRL+SUPER,0,reload_config
bind=CTRL+SUPER,9,spawn_shell,pkill waybar ; waybar

bind=SUPER,r,spawn,kitty
bind=SUPER,e,spawn,thunar
bind=SUPER,m,spawn,rofi -show drun
bind=SUPER,b,spawn,firefox

bind=SUPER,l,spawn,hyprlock
bind=NONE,Print,spawn,~/.config/mango/scripts/screenshot.sh --full
bind=NONE,XF86SelectiveScreenshot,spawn,~/.config/mango/scripts/screenshot.sh

# Laptop multimedia keys for volume and LCD brightness
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-

# exit
bind=SUPER,c,killclient,
bind=CTRL+ALT,delete,quit
bind=SUPER,j,dwindle_toggle_split_direction

bind=SUPER,backslash,togglefloating
bind=SUPER,f,set_proportion,1.0
bind=SUPER,space,switch_proportion_preset
bind=SUPER,escape,toggleoverview

# Move focus with super + arrow keys
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Move windows with super + shift + arrow key
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Switch window focus
bind=SUPER,Tab,focusstack,next

# Switch workspaces with mainMod + [0-9]
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9
bind=SUPER+SHIFT,0,toggleglobal

# Switch workspace up/down
bind=SUPER+CTRL,Up,viewtoleft
bind=SUPER+CTRL,Down,viewtoright

# Move/resize windows with mainMod + LMB/RMB and dragging
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

#-----------------------------------------------------------------------------------------------------------
# Monitor rules
#-----------------------------------------------------------------------------------------------------------

monitorrule=name:eDP-1,width:1920,height:1200,refresh:60,x:0,y:0,scale:1.25,vrr:0,rr:0

#-----------------------------------------------------------------------------------------------------------
# Layer rules
#-----------------------------------------------------------------------------------------------------------

layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

#-----------------------------------------------------------------------------------------------------------
# Layout rules
#-----------------------------------------------------------------------------------------------------------

tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle

#-----------------------------------------------------------------------------------------------------------
# Window rules
#-----------------------------------------------------------------------------------------------------------

# Firefox
windowrule=scroller_proportion:1.0,appid:firefox
windowrule=isfloating:1,isglobal:1,appid:firefox,title:Picture-in-Picture

# HoMM3
windowrule=force_tearing:2,istagsilent:1,tags:4,title:^Heroes of Might and Magic III: Horn of the Abyss$

# mpv
windowrule=isfloating:1,width:700,height:400,appid:mpv

#-----------------------------------------------------------------------------------------------------------
# Blur
#-----------------------------------------------------------------------------------------------------------

blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

#-----------------------------------------------------------------------------------------------------------
# Shadows
#-----------------------------------------------------------------------------------------------------------

shadows = 0

#-----------------------------------------------------------------------------------------------------------
# Look and feel
#-----------------------------------------------------------------------------------------------------------

border_radius=8
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

cursor_theme=Bibata-Modern-Classic
cursor_size=20

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
# Available types: slide, zoom, fade, none
animation_type_open=none
animation_type_close=none
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8fba7c55
splitcolor=0xeb441eff
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

#-----------------------------------------------------------------------------------------------------------
# Scroller layout settings
#-----------------------------------------------------------------------------------------------------------

scroller_structs=10
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

#-----------------------------------------------------------------------------------------------------------
# Master-stack layout settings
#-----------------------------------------------------------------------------------------------------------

new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

#-----------------------------------------------------------------------------------------------------------
# Dwindle layout settings
#-----------------------------------------------------------------------------------------------------------

dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

#-----------------------------------------------------------------------------------------------------------
# Misc
#-----------------------------------------------------------------------------------------------------------

no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=0
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us,ru
xkb_rules_options=grp:caps_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=0

ov_tab_mode=0
