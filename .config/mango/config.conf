#─────────────────────────────────────────────────────────────────────────────
# Reload     CTRL+SUPER+0
#            mmsg dispatch reload_config
#
# Validate   mango -c ~/.config/mango/config.conf -p
#─────────────────────────────────────────────────────────────────────────────

#─────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT
# cursor theme for apps and for mango
#─────────────────────────────────────────────────────────────────────────────

# Cursor: the env vars are for client apps, cursor_* for mango itself.
# Keep both pairs in sync.
env=XCURSOR_THEME,Bibata-Modern-Classic
env=XCURSOR_SIZE,20
cursor_theme=Bibata-Modern-Classic
cursor_size=20


#─────────────────────────────────────────────────────────────────────────────
# AUTOSTART
# programs started with the session
#─────────────────────────────────────────────────────────────────────────────

# Shell: bar, launcher, notifications, wallpaper
exec_once=noctalia

# Clipboard: keep contents after the source app exits, record history
exec_once=wl-clip-persist --clipboard regular --reconnect-tries 0 &
exec_once=wl-paste --type text --watch cliphist store &
exec_once=wl-paste --type image --watch cliphist store &

# exec_once=/usr/lib/xdg-desktop-portal-wlr &
# exec_once=firefox &


#─────────────────────────────────────────────────────────────────────────────
# MONITORS
#─────────────────────────────────────────────────────────────────────────────

# Laptop panel
monitor_rule=name:eDP-1,width:1920,height:1200,refresh:60,x:0,y:0,scale:1.25,vrr:0,rr:0


#─────────────────────────────────────────────────────────────────────────────
# INPUT
#─────────────────────────────────────────────────────────────────────────────

# Device names for device_rule: `mmsg get all-devices`, or run
# `mmsg watch all-devices` and touch the device.

# ── Keyboard ────────────────────────────────────────────────────────────────

xkb_rules_layout=us,ru
xkb_rules_options=grp:caps_toggle   # Caps Lock switches layout
repeat_rate=25
repeat_delay=600
numlock_on=0

# ── Mouse (all pointer devices) ─────────────────────────────────────────────
# Changes may need a relogin to apply.

mouse_natural_scrolling=0
# 1 = flat: no acceleration, cursor follows the sensor DPI 1:1.
# (0 behaves the same in mango, but also forces accel_speed to 0.)
mouse_accel_profile=1
mouse_accel_speed=0.0               # -1.0 … 1.0, only used with profile 1/2

# ── Trackpad (currently disabled) ───────────────────────────────────────────
# Changes may need a relogin to apply.

disable_trackpad=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# ── Per-device overrides ────────────────────────────────────────────────────
# Keychron Nape Pro: small 25 mm ball, gentle acceleration keeps aiming precise.
# Check the exact name with `mmsg get all-devices` before enabling.
device_rule=name:Keychron Nape Pro Mouse,accel_profile:1,accel_speed:-0.3


#─────────────────────────────────────────────────────────────────────────────
# APPEARANCE
#─────────────────────────────────────────────────────────────────────────────

# Colors come from noctalia.conf, see THEME at the end.

# ── Borders and corners ─────────────────────────────────────────────────────

border_px=1
border_radius=8
no_border_when_single=0
no_radius_when_single=0

# ── Gaps ────────────────────────────────────────────────────────────────────

gap_inner_horizontal=8  # inner, horizontal
gap_inner_vertical=8    # inner, vertical
gap_outer_horizontal=8  # outer, horizontal
gap_outer_vertical=8    # outer, vertical

# ── Opacity ─────────────────────────────────────────────────────────────────

focused_opacity=1.0
unfocused_opacity=1.0

# ── Blur ────────────────────────────────────────────────────────────────────

blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

# Stronger alternative:
# blur_params_num_passes=4
# blur_params_radius=6
# blur_params_brightness=1.0
# blur_params_contrast=1.4
# blur_params_saturation=1.4

# ── Shadows ─────────────────────────────────────────────────────────────────

shadows=0

# To enable:
# shadows=1
# layer_shadows=0
# shadow_only_floating=0
# shadows_size=4
# shadows_blur=12
# shadows_position_x=2
# shadows_position_y=2
# shadows_color=0x000000ff


#─────────────────────────────────────────────────────────────────────────────
# ANIMATIONS
#─────────────────────────────────────────────────────────────────────────────

animations=1
layer_animations=1

# ── Types: slide, zoom, fade, none ──────────────────────────────────────────

animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

tag_animation_direction=0   # 1 = horizontal, 0 = vertical

# ── Durations (ms) ──────────────────────────────────────────────────────────

animation_duration_open=200
animation_duration_close=60
animation_duration_move=200
animation_duration_tag=200
# animation_duration_focus=0

# ── Fade ────────────────────────────────────────────────────────────────────

animation_fade_in=0
animation_fade_out=0
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.5

# ── Zoom ────────────────────────────────────────────────────────────────────

zoom_initial_ratio=0.6
zoom_end_ratio=0.8

# ── Bezier curves (defaults are used while commented) ───────────────────────

# animation_curve_open=0.46,1.0,0.20,1.1
# animation_curve_move=0.40,1.0,0.06,1.1
# animation_curve_tag=0.46,0,0.10,1.1
# animation_curve_close=0.46,1.0,0.29,1.0
# animation_curve_focus=0.46,1.0,0.29,0.99
# animation_curve_opacity_fade_in=0.46,1.0,0.29,0.99
# animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5


#─────────────────────────────────────────────────────────────────────────────
# LAYOUTS
#─────────────────────────────────────────────────────────────────────────────

# ── Layout per tag ──────────────────────────────────────────────────────────

tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle

# ── Scroller (tag 1) ────────────────────────────────────────────────────────

scroller_structs=4
scroller_default_proportion=0.5
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0   # cycled by SUPER+space
scroller_focus_center=1
scroller_prefer_center=0
edge_scroller_pointer_focus=1

# ── Dwindle (tags 2–9) ──────────────────────────────────────────────────────

dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# ── Master-stack ────────────────────────────────────────────────────────────

new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# ── Scratchpad ──────────────────────────────────────────────────────────────

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# ── Overview (SUPER+escape) ─────────────────────────────────────────────────

enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=5


#─────────────────────────────────────────────────────────────────────────────
# BEHAVIOR
#─────────────────────────────────────────────────────────────────────────────

# ── Focus ───────────────────────────────────────────────────────────────────

sloppy_focus=0            # focus follows click, not hover
focus_on_activate=1      # apps requesting activation get focus
focus_cross_monitor=0
focus_cross_tag=0
warp_cursor=1             # move the cursor to the newly focused window

# ── Dragging and floating ───────────────────────────────────────────────────

drag_tile_to_tile=1
drag_tile_small=1
enable_floating_snap=0
snap_distance=30

# ── Misc ────────────────────────────────────────────────────────────────────

axis_bind_apply_timeout=100
idle_inhibit_ignore_visible=0


#─────────────────────────────────────────────────────────────────────────────
# RULES
#─────────────────────────────────────────────────────────────────────────────

# Firefox: full-width column in the scroller; PiP floats on every tag
window_rule=scroller_proportion:1.0,app_id:firefox
window_rule=is_floating:1,is_global:1,app_id:firefox,title:Picture-in-Picture

# mpv: small floating window
window_rule=is_floating:1,width:700,height:400,app_id:mpv

# HoMM3: tag 4 without switching to it, tearing allowed
window_rule=force_tearing:2,is_tag_silent:1,tags:4,title:^Heroes of Might and Magic III: Horn of the Abyss$

# ── Layer rules ─────────────────────────────────────────────────────────────

# layer_rule=animation_type_open:fade,layer_name:rofi
# layer_rule=animation_type_close:fade,layer_name:rofi


#─────────────────────────────────────────────────────────────────────────────
# BINDINGS
#─────────────────────────────────────────────────────────────────────────────

# ── Session ─────────────────────────────────────────────────────────────────

bind=CTRL+SUPER,0,reload_config
bind=CTRL+ALT,delete,spawn,~/.config/scripts/power-menu.sh

# ── Applications ────────────────────────────────────────────────────────────

bind=SUPER,r,spawn,foot
bind=SUPER,e,spawn,foot elio
bind=SUPER,t,spawn,thunar
bind=SUPER,b,spawn,firefox
bind=SUPER,m,spawn,noctalia msg panel-toggle launcher
bind=NONE,XF86Launch3,spawn,noctalia msg panel-toggle launcher

# ── Screenshots and OCR ─────────────────────────────────────────────────────

bind=NONE,Print,spawn,~/.config/mango/scripts/screenshot.sh --full
bind=NONE,XF86SelectiveScreenshot,spawn,~/.config/mango/scripts/screenshot.sh
# Select an area, recognize text (rus+eng), copy it
bind=SUPER,o,spawn,grim -g \"$(slurp)\" - | tesseract -l rus+eng - - | wl-copy

# ── Media and brightness ────────────────────────────────────────────────────

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-

# ── Windows ─────────────────────────────────────────────────────────────────

bind=SUPER,c,killclient,
bind=SUPER,backslash,togglefloating
bind=SUPER,f,set_proportion,1.0
bind=SUPER,space,switch_proportion_preset
bind=SUPER,j,dwindle_toggle_split_direction
bind=SUPER,escape,toggleoverview

# Focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,Tab,focusstack,next

# Move
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# ── Tags ────────────────────────────────────────────────────────────────────

# Go to tag
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# Send window to tag (stay here)
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9
bind=SUPER+SHIFT,0,toggleglobal   # show window on all tags

# Previous / next tag
bind=SUPER+CTRL,Up,viewtoleft
bind=SUPER+CTRL,Down,viewtoright

# ── Mouse ───────────────────────────────────────────────────────────────────

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize


#─────────────────────────────────────────────────────────────────────────────
# THEME
#─────────────────────────────────────────────────────────────────────────────

source=./noctalia.conf
