#-----------------------------------------------------------------------------
# Env
#-----------------------------------------------------------------------------

env=XCURSOR_SIZE,20
env=XCURSOR_THEME,Bibata-Modern-Classic

#-----------------------------------------------------------------------------
# Autostart
#-----------------------------------------------------------------------------

exec-once=noctalia
# exec-once=/usr/lib/xdg-desktop-portal-wlr &
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0 &
exec-once=wl-paste --type text --watch cliphist store &
exec-once=wl-paste --type image --watch cliphist store &
# exec-once=firefox &

#-----------------------------------------------------------------------------
# Binds
#-----------------------------------------------------------------------------

# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=CTRL+SUPER,0,reload_config
# bind=CTRL+SUPER,9,spawn_shell,pkill waybar ; waybar

bind=SUPER,r,spawn,foot
bind=SUPER,t,spawn,thunar
bind=SUPER,e,spawn,foot elio
bind=SUPER,m,spawn,noctalia msg panel-toggle launcher
bind=NONE,XF86Launch3,spawn,noctalia msg panel-toggle launcher
bind=SUPER,b,spawn,firefox
bind=SUPER,o,spawn,grim -g \"$(slurp)\" - | tesseract -l rus+eng - - | wl-copy

bind=NONE,Print,spawn,~/.config/mango/scripts/screenshot.sh --full
bind=NONE,XF86SelectiveScreenshot,spawn,~/.config/mango/scripts/screenshot.sh

# Laptop multimedia keys for volume and LCD brightness
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
# bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
# bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
# bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
# bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
# bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# exit
bind=SUPER,c,killclient,
bind=CTRL+ALT,delete,spawn,~/.config/scripts/power-menu.sh
bind=SUPER,j,dwindle_toggle_split_direction

bind=SUPER,backslash,togglefloating
bind=SUPER,f,set_proportion,1.0
bind=SUPER,space,switch_proportion_preset
bind=SUPER,escape,toggleoverview

# Move focus with super + arrow keys
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Move windows with super + shift + arrow key
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Switch window focus
bind=SUPER,Tab,focusstack,next

# Switch workspaces with mainMod + [0-9]
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9
bind=SUPER+SHIFT,0,toggleglobal

# Switch workspace up/down
bind=SUPER+CTRL,Up,viewtoleft
bind=SUPER+CTRL,Down,viewtoright

# Move/resize windows with mainMod + LMB/RMB and dragging
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

#-----------------------------------------------------------------------------
# Monitor rules
#-----------------------------------------------------------------------------

monitorrule=name:eDP-1,width:1920,height:1200,refresh:60,x:0,y:0,scale:1.25,vrr:0,rr:0

#-----------------------------------------------------------------------------
# Layer rules
#-----------------------------------------------------------------------------

# layerrule=animation_type_open:fade,layer_name:rofi
# layerrule=animation_type_close:fade,layer_name:rofi

#-----------------------------------------------------------------------------
# Layout rules
#-----------------------------------------------------------------------------

tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle

#-----------------------------------------------------------------------------
# Window rules
#-----------------------------------------------------------------------------

# Firefox
windowrule=scroller_proportion:1.0,appid:firefox
windowrule=isfloating:1,isglobal:1,appid:firefox,title:Picture-in-Picture

# HoMM3
windowrule=force_tearing:2,istagsilent:1,tags:4,title:^Heroes of Might and Magic III: Horn of the Abyss$

# mpv
windowrule=isfloating:1,width:700,height:400,appid:mpv

#-----------------------------------------------------------------------------
# Blur
#-----------------------------------------------------------------------------

# blur=1
# blur_layer=0
# blur_optimized=1
# blur_params_num_passes = 4
# blur_params_radius = 6
# blur_params_noise = 0.02
# blur_params_brightness = 1.0
# blur_params_contrast = 1.4
# blur_params_saturation = 1.4

blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0
layer_animations=0

#-----------------------------------------------------------------------------
# Shadows
#-----------------------------------------------------------------------------

shadows = 0

# shadows=1
# layer_shadows=0
# shadow_only_floating=0
# shadows_size=4
# shadows_blur=12
# shadows_position_x=2
# shadows_position_y=2
# shadowscolor=0x000000ff

#-----------------------------------------------------------------------------
# Animations
#-----------------------------------------------------------------------------

animations=1
layer_animations=1
animation_fade_in=0
animation_fade_out=0

# Animation Type (Available types: slide, zoom, fade, none.)
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

# Fade Settings
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.5

# Zoom Settings
zoom_initial_ratio=0.6
zoom_end_ratio=0.8

# Durations (in milliseconds)
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=60
# animation_duration_focus=0

# Bezier curves
# animation_curve_open=0.46,1.0,0.20,1.1
# animation_curve_move=0.40,1.0,0.06,1.1
# animation_curve_tag=0.46,0,0.10,1.1
# animation_curve_close=0.46,1.0,0.29,1.0
# animation_curve_focus=0.46,1.0,0.29,0.99
# animation_curve_opafadein=0.46,1.0,0.29,0.99
# animation_curve_opafadeout=0.5,0.5,0.5,0.5

# Tag Animation Direction (1: horizontal, 0: vertical)
tag_animation_direction = 0

#-----------------------------------------------------------------------------
# Look and feel
#-----------------------------------------------------------------------------

border_radius=12
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

cursor_theme=Bibata-Modern-Classic
cursor_size=20

# Appearance
gappih=5
gappiv=5
gappoh=5
gappov=5
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=1

#-----------------------------------------------------------------------------
# Scroller layout
#-----------------------------------------------------------------------------

scroller_structs=5
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

#-----------------------------------------------------------------------------
# Master-stack layout
#-----------------------------------------------------------------------------

new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

#-----------------------------------------------------------------------------
# Dwindle layout
#-----------------------------------------------------------------------------

dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

#-----------------------------------------------------------------------------
# Overview
#-----------------------------------------------------------------------------

enable_hotarea=0
overviewgappi=5
overviewgappo=5

#-----------------------------------------------------------------------------
# Misc
#-----------------------------------------------------------------------------

no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=0
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us,ru
xkb_rules_options=grp:caps_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad=1
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=0

source=~/.config/mango/noctalia.conf
