[bar.default]
background_opacity = 0.39999999105930328
border_width = 1.0
capsule_thickness = 0.99999998137354851
center = [ "audio_visualizer" ]
contact_shadow = false
end = [ "bar", "widget_2", "status", "widget", "bluetooth", "network", "battery", "clock" ]
font_weight = 400
hover_highlight = false
margin_edge = 8
margin_ends = 8
padding = 8
radius = 8
shadow = false
start = [ "recorder", "ocr", "clipboard", "workspaces" ]
thickness = 24
widget_spacing = 4

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
shadow = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Moscow, Russia"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 778.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[osd]
orientation = "vertical"
position_vertical = "center_left"

    [osd.kinds]
    keyboard_layout = false

[plugin_settings."blackbartblues/audio-switcher"]
show_percentage = false

[plugin_settings."fel/ocr"]
languages = "eng+rus"

[plugin_settings."inndie/nape_pro_status"]
device_match = "Keychron Nape Pro Mouse"

[plugin_settings."mdj2812/mihomo-control"]
port = "9093"

[plugin_settings."noctalia/screen_recorder"]
video_source = "focused"

[plugins]
enabled = [
    "ksergey/awg-status",
    "fel/ocr",
    "noctalia/screen_recorder",
    "blackbartblues/audio-switcher",
    "aristides/udiskie",
    "mdj2812/mihomo-control",
    "inndie/nape_pro_status"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
date_format = "%A, %F"
font_family = "HarmonyOS Sans"
panel_anchor_bar = "default"

    [shell.launcher]
    categories = false
    compact = true
    fetch_exchange_rates = false

    [shell.panel]
    polkit_placement = "attached"
    shadow = false

[system.monitor]
enabled = false

[theme]
builtin = "Ayu"
community_palette = "Catppuccin Frappe Sapphire"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "cava", "foot", "gtk3", "gtk4", "mango" ]
    community_ids = [ "pywalfox-beta4" ]

[wallpaper]
directory = "/home/ksergey/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/ksergey/Pictures/Wallpapers/ytbvy9r8gjsh1.png"

    [wallpaper.last]
    path = "/home/ksergey/Pictures/Wallpapers/ytbvy9r8gjsh1.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/ksergey/Pictures/Wallpapers/ytbvy9r8gjsh1.png"

[widget.audio_visualizer]
color_2 = "error"
width = 128

[widget.bar]
enabled = false
type = "inndie/nape_pro_status:bar"

[widget.battery]
show_label = false

[widget.clock]
color = "secondary"

[widget.launcher]
enabled = false

[widget.network]
show_label = false

[widget.ocr]
type = "fel/ocr:ocr"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.status]
type = "aristides/udiskie:status"

[widget.widget]
type = "blackbartblues/audio-switcher:widget"

[widget.widget_2]
label_content = "connections"
type = "mdj2812/mihomo-control:widget"

[widget.workspaces]
hide_when_empty = true
style = "minimal"
